name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Forge desktop release the bridge is built and tested against.
  FORGE_VERSION: 2.0.16

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Cache the Forge release
        id: forge
        uses: actions/cache@v6
        with:
          path: forge.tar.bz2
          key: forge-${{ env.FORGE_VERSION }}
      - name: Download the Forge release
        if: steps.forge.outputs.cache-hit != 'true'
        run: curl -fsSL -o forge.tar.bz2 "https://github.com/Card-Forge/forge/releases/download/forge-${FORGE_VERSION}/forge-installer-${FORGE_VERSION}.tar.bz2"
      - name: Unpack Forge
        run: |
          mkdir "$RUNNER_TEMP/forge"
          tar -xjf forge.tar.bz2 -C "$RUNNER_TEMP/forge"
          jar=$(find "$RUNNER_TEMP/forge" -name "forge-gui-desktop-${FORGE_VERSION}-jar-with-dependencies.jar")
          test -f "$jar"
          echo "FORGE_JAR=$jar" >> "$GITHUB_ENV"
          echo "FORGE_HOME=$(dirname "$jar")" >> "$GITHUB_ENV"
      - name: Build
        run: mvn -B package -Dforge.jar="$FORGE_JAR"
      # Hosts a draft and matches in-process. About 18 minutes on a laptop, so not on every push.
      - name: Test
        if: github.event_name != 'push'
        run: mvn -B test -DskipTests=false -Dforge.jar="$FORGE_JAR" -Dforge.home="$FORGE_HOME"
      - uses: actions/upload-artifact@v7
        with:
          name: forge-agent-bridge
          path: target/forge-agent-bridge-*.jar
